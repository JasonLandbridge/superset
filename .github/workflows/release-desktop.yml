name: Release Desktop App

on:
  push:
    tags:
      - "desktop-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release from the selected branch (e.g., 1.13.2). Empty uses apps/desktop/package.json."
        required: false
        type: string
        default: ""
      publish:
        description: "Publish immediately instead of creating a draft release."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      create_release: ${{ steps.meta.outputs.create_release }}
      draft: ${{ steps.meta.outputs.draft }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve metadata
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION=$(node -p "require('./apps/desktop/package.json').version")
            fi
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid version: $VERSION"
              exit 1
            fi
            TAG_NAME="desktop-v${VERSION}"
            CREATE_RELEASE="true"
            if [ "${{ inputs.publish }}" = "true" ]; then
              DRAFT="false"
            else
              DRAFT="true"
            fi
          else
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${TAG_NAME#desktop-v}"
            CREATE_RELEASE="true"
            DRAFT="true"
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "create_release=$CREATE_RELEASE" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG_NAME"
          echo "Version: $VERSION"
          echo "Draft: $DRAFT"

  build:
    needs: prepare
    uses: ./.github/workflows/build-desktop.yml
    with:
      channel: stable
      version_override: ${{ needs.prepare.outputs.version }}
      electron_builder_config: electron-builder.ts
      artifact_prefix: desktop
      artifact_retention_days: 30
    secrets: inherit

  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.create_release == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Find previous desktop release tag
        id: prev_tag
        run: |
          CURRENT_TAG="${{ needs.prepare.outputs.tag_name }}"
          PREVIOUS_TAG=$(git tag -l 'desktop-v*' | sort -V | grep -B1 "^${CURRENT_TAG}$" | head -1 || true)
          if [ "$PREVIOUS_TAG" = "$CURRENT_TAG" ] || [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=""
          fi
          echo "current_tag=${CURRENT_TAG}" >> $GITHUB_OUTPUT
          echo "previous_tag=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT
          echo "Current tag: ${CURRENT_TAG}"
          echo "Previous tag: ${PREVIOUS_TAG:-none}"

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Create stable-named copies for latest download URLs
        run: |
          cd release-artifacts
          for file in *.AppImage; do
            if [[ -f "$file" ]]; then
              arch=$(echo "$file" | sed -E 's/.*-([^-]+)\.AppImage$/\1/')
              cp "$file" "Superset-${arch}.AppImage"
              echo "Created stable copy: Superset-${arch}.AppImage"
            fi
          done
          for file in *-linux.yml; do
            if [[ -f "$file" && "$file" != "latest-linux.yml" ]]; then
              cp "$file" "latest-linux.yml"
              echo "Created stable copy: latest-linux.yml"
              break
            fi
          done
          echo "Release artifacts:"
          ls -la

      - name: Generate release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_TAG="${{ steps.prev_tag.outputs.previous_tag }}"
          CURRENT_TAG="${{ steps.prev_tag.outputs.current_tag }}"

          if git rev-parse "$CURRENT_TAG" >/dev/null 2>&1; then
            if [ -n "$PREVIOUS_TAG" ]; then
              NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
                -f tag_name="${CURRENT_TAG}" \
                -f previous_tag_name="${PREVIOUS_TAG}" \
                --jq '.body')
            else
              NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
                -f tag_name="${CURRENT_TAG}" \
                --jq '.body')
            fi
          else
            NOTES="Manual desktop release from ${{ github.ref_name }} at ${{ github.sha }}."
          fi

          echo "$NOTES" > release_notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
        run: |
          set -euo pipefail
          draft_flag=()
          if [ "$DRAFT" = "true" ]; then
            draft_flag=(--draft)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-artifacts/* --clobber
            gh release edit "$TAG_NAME" \
              --title "Superset Desktop $TAG_NAME" \
              --notes-file release_notes.md \
              --draft="$DRAFT"
          else
            gh release create "$TAG_NAME" \
              release-artifacts/* \
              --title "Superset Desktop $TAG_NAME" \
              --notes-file release_notes.md \
              --target "${{ github.sha }}" \
              "${draft_flag[@]}"
          fi
